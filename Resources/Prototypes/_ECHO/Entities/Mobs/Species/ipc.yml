- type: entity
  parent:
  - EchoAppearanceIPC
  - MobAtmosStandard
  - MobFlammable
  - BaseSpeciesMob
  id: EchoMobIPC
  name: Urist McClank
  components:
  # Stats
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      125: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    allowRevives: true
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 220
      behaviors:
      - !type:GibBehavior { }
  - type: SlowOnDamage
    speedModifierThresholds:
      40: 0.8
      60: 0.6
      80: 0.4
      100: 0.3

  # Visuals + sounds
  - type: Posing
  - type: InteractionPopup
    interactSuccessString: petting-success-ipc
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: Vocal
    sounds:
      Male: UnisexIPC
      Female: UnisexIPC
      Unsexed: UnisexIPC
  - type: Deathgasp
    prototype: IPCDeathgasp
  - type: TypingIndicator
    proto: robot
  - type: MidroundCustomization
    actionId: EchoIPCCustomizationAction
    allowedLayers: [ FacialHair ]
    organs: [ Head ]
    radialOptions:
    - optionName: customizable-appearance-screen-change
      icon:
       sprite: _ECHO/Interface/Actions/actions_ipc.rsi
       state: screen
      uiKey: enum.MidroundCustomizationAppearanceUiKey.Key
    - optionName: customizable-appearance-barks-change
      icon: Interface/Actions/scream.png
      uiKey: enum.MidroundCustomizatioBarksUiKey.Key
    - optionName: customizable-appearance-flashlight-change
      icon:
        sprite: Objects/Tools/flashlight.rsi
        state: flashlight
      event: !type:TogglePointLightFollowLayerEvent

  # Radio
  - type: Wires
    boardName: "ipc-board-name"
    layoutId: IPC
  - type: WiresPanel
  - type: EncryptionKeyHolder
    keySlots: 3
    examineWhileLocked: false
    keysExtractionMethod: Cutting
  - type: ActiveRadio
  - type: BatteryIntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
  - type: BatteryIntrinsicRadioTransmitter

  # Light
  - type: PointLightFollowLayerColor
    enumLayer: enum.HumanoidVisualLayers.FacialHair
    enabled: false
  - type: HandheldLight
    wattage: 0.5
    toggleOnInteract: false
    addPrefix: false
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: PointLight
    enabled: false
    color: "#ffffff"
    mask: /Textures/Effects/LightMasks/cone.png
    offset: 0,-0.3
    autoRot: true
    radius: 3
    energy: 2
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        startValue: 0.1
        endValue: 2.0
        isLooped: true

  # Slots
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: ItemSlots
    slots:
      cell_slot:
        locked: true
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: Lock
    locked: true
    lockOnClick: false
    unlockOnClick: false
    lockTime: 5
    unlockTime: 5
    breakOnAccessBreaker: false
  - type: SlotRequiresLock
    slotId: cell_slot

  # Power
  - type: APCBatteryDrinker
  - type: PassiveBatteryDrain
    drainAmount: 0.75
  - type: ChargeLevelAlert
  - type: ChargeMoveSpeedThresholds
    speedModifierThresholds:
      0.7: 1
      0.5: 0.75
      0.2: 0.5
      0: 0.35
  - type: LowBatterySignal
    interval: 12
    othersPopup: silicon-power-low
    selfPopup: silicon-power-low
    sound:
      path: "/Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg"
      params:
        volume: -2
  - type: ScreenGlitch
  - type: ScreenGlitchOnEmp
    chroma: 3
    duration: 10
    effectSpeed: 4
    offset: 8
    seedUpdateInterval: 0.05

  # Everything else
  - type: CanEnterCryostorage
  - type: OfferItem
  - type: EyeProtection
    protectionTime: 12
  - type: ContentEye
    maxZoom: 1.0,1.0
  - type: LightningTarget
    priority: 3
    lightningExplode: false
  - type: Tag
    tags:
    - CanPilot
    - DoorBumpOpener
    - SiliconEmotes
    - Unimplantable
    - AnomalyHost
  - type: UserInterface
    interfaces:
      enum.VoiceMaskUIKey.Key:
        type: VoiceMaskBoundUserInterface
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
      enum.MidroundCustomizationAppearanceUiKey.Key:
        type: CustomizableAppearanceBoundUserInterface
      enum.MidroundCustomizatioBarksUiKey.Key:
        type: CustomizableBarksBoundUserInterface
  - type: Inventory
    templateId: ipc
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female

- type: entity
  parent: BaseSpeciesAppearance
  id: EchoAppearanceIPC
  name: human appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: EchoTorsoIPC
      Head: EchoOrganIPCHead
      ArmLeft: EchoOrganIPCArmLeft
      ArmRight: EchoOrganIPCArmRight
      HandRight: EchoOrganIPCHandRight
      HandLeft: EchoOrganIPCHandLeft
      LegLeft: EchoOrganIPCLegLeft
      LegRight: EchoOrganIPCLegRight
      FootLeft: EchoOrganIPCFootLeft
      FootRight: EchoOrganIPCFootRight
      Brain: EchoOrganBrainIPC
      Eyes: EchoOrganIPCEyes
      Tongue: EchoOrganIPCTongue
      Ears: EchoOrganIPCEars
      Heart: EchoOrganIPCPump
  - type: HumanoidProfile
    species: Human
